<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>BLACK HARVEST — New City Build</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="game"></canvas>
<div id="bootError" hidden></div>
<div id="startScreen">
  <div class="logo">BLACK HARVEST</div>
  <div class="tag">NEW CITY BUILD</div>
  <button id="enterCity">ENTER CITY</button>
  <div class="hint">Touch: left = move · right = look · RUN = sprint</div>
</div>
<div id="hud" hidden>
  <div class="topbar"><span id="clock">09:00</span><span id="status">CITY</span></div>
  <div id="crosshair">+</div>
  <div id="leftPad"><div id="leftKnob"></div></div>
  <div id="runButton">RUN</div>
  <div id="lookZone"></div>
  <div id="help">WASD / mouse on desktop</div>
</div>
<script src="main.js"></script>
</body>
</html>
