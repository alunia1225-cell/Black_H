<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101212">
<title>GRITTY CITY — BOOT FIX 04</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="boot"><strong>GRITTY CITY</strong><span id="bootStatus">3D ENGINE BOOT...</span></div>
<div id="hud"><b>GRITTY CITY</b><span id="zone">BOOT</span><span id="fps">-- FPS</span></div>
<div id="cross">+</div>
<div id="joy"><i id="stick"></i></div>
<div id="look"></div>
<div id="buttons"><button id="fire">FIRE</button><button id="reload">RELOAD</button><button id="run">RUN</button><button id="jump">JUMP</button></div>
<div id="rotate">横向きでプレイしてください</div>
<script type="module" src="./main.js"></script>
</body>
</html>
