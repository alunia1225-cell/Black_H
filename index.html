<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BLACK HARVEST — City Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" style="touch-action:none;user-select:none;-webkit-user-select:none;"></canvas>

<div id="crosshair"></div>
<div id="mobile">
  <div id="stick"><div id="knob"></div></div>
  <div id="lookHint">SWIPE</div>
  <button id="runBtn">RUN</button>
</div>
<div id="start"><div class="panel"><div class="title">BLACK HARVEST</div><div class="desc">OFFLINE / WEBGL2 / BLACK HARVEST • URBAN DISTRICT</div><button id="enter">ENTER CITY</button><div class="small">左アナログパッドで移動。右側をスワイプして視点操作。</div></div></div>
<script src="main.js"></script>
